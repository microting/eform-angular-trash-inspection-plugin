<ng-template #toolbarTpl>
  <div class="d-flex flex-row justify-content-start flex-nowrap">
    <div class="d-flex flex-column mr-2 ml-2">
      <mat-form-field>
        <mat-label>{{ 'Label' | translate }}</mat-label>
        <input
          matInput
          type="text"
          (ngModelChange)="onLabelInputChanged($event)"
          [ngModel]="selectTrashInspectionsNameFilters$ | async"
          id="labelInput"
        />
      </mat-form-field>
    </div>
    <div class="d-flex flex-column mr-2 ml-2" *ngIf="navEnabled">
      <mat-form-field>
        <mat-label>{{ 'NAV' | translate }}</mat-label>
        <mat-select
          [ngModel]="selectTrashInspectionsNavStatusFilter$ | async"
          (ngModelChange)="onNavStatusFilterChanged($event)"
          id="navStatusFilterSelector"
        >
          <mat-option value="">{{ 'All' | translate }}</mat-option>
          <mat-option value="notSent">{{ 'Not sent to NAV' | translate }}</mat-option>
          <mat-option value="failed">{{ 'Failed to send to NAV' | translate }}</mat-option>
          <mat-option value="unconfirmed">{{ 'Sent to NAV, unconfirmed' | translate }}</mat-option>
          <mat-option value="sent">{{ 'Sent to NAV' | translate }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>
</ng-template>

<mtx-grid
  [data]="trashInspectionsModel.entities"
  [columns]="tableHeaders"
  [cellTemplate]="{status: statusTpl, responseSendToCallBackUrl: navTpl, actions: actionsTpl}"
  [paginationTemplate]="paginatorTpl"
  [showPaginator]="true"
  [pageOnFront]="false"
  [rowStriped]="true"
  [showToolbar]="true"
  [toolbarTemplate]="toolbarTpl"
  [showColumnMenuButton]="false"
  [sortActive]="selectTrashInspectionsPaginationSort$ | async"
  [sortDirection]="selectTrashInspectionsPaginationIsSortDsc$ | async"
  (sortChange)="sortTable($event)">
</mtx-grid>

<ng-template #statusTpl let-row>
  <status-bar [status]="row.status"></status-bar>
</ng-template>

<ng-template #navTpl let-row>
  <mat-icon
    *ngIf="row.responseSendToCallBackUrl && row.successMessageFromCallBack"
    class="material-icon-success"
    [matTooltip]="row.successMessageFromCallBack"
  >check_circle</mat-icon>
  <mat-icon
    *ngIf="row.responseSendToCallBackUrl && !row.successMessageFromCallBack"
    class="text-warning"
    [matTooltip]="'Sent to NAV, unconfirmed' | translate"
  >help</mat-icon>
  <mat-icon
    *ngIf="!row.responseSendToCallBackUrl && row.errorFromCallBack"
    class="material-icon-danger"
    [matTooltip]="row.errorFromCallBack"
  >error</mat-icon>
  <mat-icon
    *ngIf="!row.responseSendToCallBackUrl && !row.errorFromCallBack"
    [matTooltip]="'Not sent to NAV' | translate"
  >remove</mat-icon>
</ng-template>

<ng-template #actionsTpl let-row let-index="index">
  <div class="d-flex">
    <button
      mat-icon-button
      color="warn"
      matTooltip="{{ 'Delete Trash Inspection' | translate }}"
      (click)="showDeleteTrashInspectionModal(row)"
    >
      <mat-icon>delete</mat-icon>
    </button>
    <button
      mat-icon-button
      color="accent"
      *ngIf="row.status === 100"
      [routerLink]="['/cases/edit/' + row.sdkCaseId + '/' + row.sdkeFormId]"
      [queryParams]="{reverseRoute: '/plugins/trash-inspection-pn/trash-inspections'}"
      matTooltip="{{ 'Edit Case' | translate }}"
    >
      <mat-icon>edit</mat-icon>
    </button>
    <button
      mat-icon-button
      color="accent"
      matTooltip="{{ 'Get PDF' | translate }}"
      (click)="downloadPDF(row)"
      *ngIf="row.status === 100"
    >
      <fa-icon
        icon="file-pdf"
        size="lg"
        [fixedWidth]="true"
      ></fa-icon>
    </button>
    <button
      mat-icon-button
      color="accent"
      matTooltip="{{ 'Get DOCX' | translate }}"
      (click)="downloadDocx(row)"
      *ngIf="row.status === 100"
    >
      <fa-icon
        icon="file-word"
        size="lg"
        [fixedWidth]="true"
      ></fa-icon>
    </button>
    <button
      mat-icon-button
      color="accent"
      matTooltip="{{ 'Analytics' | translate }}"
      (click)="showVersionViewModal(row.id)"
    >
      <mat-icon>analytics</mat-icon>
    </button>
    <button
      mat-icon-button
      color="accent"
      class="sendTrashInspectionToNavBtn"
      matTooltip="{{ 'Send to NAV' | translate }}"
      [disabled]="isSendingToNav(row)"
      (click)="showSendToNavModal(row)"
      *ngIf="authStateService.checkClaim(trashInspectionPnClaims.updateTrashInspections)
        && row.navEnabled
        && row.status === 100
        && !(row.responseSendToCallBackUrl && row.successMessageFromCallBack)"
    >
      <mat-spinner *ngIf="isSendingToNav(row)" [diameter]="20"></mat-spinner>
      <mat-icon *ngIf="!isSendingToNav(row)">cloud_upload</mat-icon>
    </button>
  </div>
</ng-template>

<ng-template #paginatorTpl>
  <eform-pagination
    [pagination]="selectTrashInspectionsPagination$ | async"
    (paginationChanged)="onPaginationChanged($event)"
  ></eform-pagination>
</ng-template>
